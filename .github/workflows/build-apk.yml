name: Build Jouri APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install deps
        run: npm ci || npm install
      - name: Capacitor sync
        run: npx cap sync android
      - name: Accept Android SDK licenses
        run: yes | "$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)" --licenses || true
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Jouri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jouri-APK
          path: Jouri.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jouri-v${{ github.run_number }}
          name: Jouri APK v${{ github.run_number }}
          files: Jouri.apk
